<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinema List</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            padding: 15px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="{% url 'movie_list' %}">Movies</a>
        <a href="{% url 'cinema_list' %}">Cinemas</a>
        <a href="{% url 'branch_list' %}">Branches</a>
        <a href="{% url 'genre_list' %}">Genres</a>
        <a href="{% url 'cinema_movie_list' %}">Showtime</a>
    </div>
    <div class="content">
        <h2>Cinema List</h2>
        <a class="btn btn-primary" href="{% url 'cinema_create' %}">Add New Cinema</a>
        <ul class="list-group mt-3">
            {% for cinema in cinemas %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="#" class="cinema-detail-link" data-toggle="modal" data-target="#cinemaDetailModal" data-id="{{ cinema.pk }}">{{ cinema.cinema_name }} (Branch: {{ cinema.branch.branch_name }})</a>
                    <div>
                        <a class="btn btn-sm btn-warning" href="{% url 'cinema_update' cinema.pk %}">Edit</a>
                        <form method="post" action="{% url 'cinema_delete' cinema.pk %}" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="cinemaDetailModal" tabindex="-1" role="dialog" aria-labelledby="cinemaDetailModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="cinemaDetailModalLabel">Cinema Details</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <h4 id="cinema-name"></h4>
                    <p><strong>Branch:</strong> <span id="cinema-branch"></span></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        $(document).ready(function() {
            $('.cinema-detail-link').on('click', function() {
                var cinemaId = $(this).data('id');
                $.ajax({
                    url: '{% url "cinema_detail" 0 %}'.replace('0', cinemaId),
                    method: 'GET',
                    success: function(data) {
                        $('#cinema-name').text(data.cinema_name);
                        $('#cinema-branch').text(data.branch);
                    }
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Update Seat</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1e1e;
            color: #ffffff;
        }
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            padding: 15px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
        .content h1 {
            font-size: 3rem;
            color: #ffa500;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }
        .form-container {
            background-color: #292929;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 80%;
            max-width: 800px;
            margin: 0 auto;
        }
        .form-container h2 {
            font-size: 2rem;
            color: #ffa500;
            margin-bottom: 20px;
        }
        .form-container .form-group {
            margin-bottom: 15px;
        }
        .form-container .form-control {
            background-color: #1c1e1e;
            color: white;
            border: 1px solid #495057;
        }
        .form-container .btn-primary {
            background-color: #ffa500;
            border: none;
        }
        .form-container .btn-primary:hover {
            background-color: #e69500;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="{% url 'movie_list' %}">Movies</a>
        <a href="{% url 'cinema_list' %}">Cinemas</a>
        <a href="{% url 'branch_list' %}">Branches</a>
        <a href="{% url 'genre_list' %}">Genres</a>
        <a href="{% url 'cinema_movie_list' %}">Showtime</a>
        <a href="{% url 'seat_list' %}">Seats</a>
    </div>
    <div class="content">
        <h1>{% if form.instance.pk %}Update Seat{% else %}Add Seat{% endif %}</h1>
        <div class="form-container">
            <h2>{% if form.instance.pk %}Update Seat{% else %}Add New Seat{% endif %}</h2>
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    {{ form.seat_no.label_tag }}
                    {{ form.seat_no }}
                </div>
                <button type="submit" class="btn btn-primary">{% if form.instance.pk %}Update Seat{% else %}Add Seat{% endif %}</button>
            </form>
        </div>
    </div>
</body>
</html>

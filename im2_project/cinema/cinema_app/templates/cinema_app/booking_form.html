<h1>{% if form.instance.pk %}Update{% else %}Create{% endif %} Booking</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="save-btn">Save</button>
</form>
<a href="{% url 'booking_list' %}" class="back-link">Back to List</a>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #1c1e1e;
        color: #ffffff;
    }

    h1 {
        font-size: 2rem;
        color: #ffa500;
        text-align: center;
        margin-top: 20px;
    }

    form {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background-color: #2b2b2b;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    form p {
        font-size: 1rem;
        margin-bottom: 15px;
    }

    .save-btn {
        background-color: #ffa500;
        color: #1c1e1e;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
    }

    .save-btn:hover {
        background-color: #ffb732;
    }

    .back-link {
        display: block;
        text-align: center;
        margin-top: 20px;
        color: #ffa500;
        text-decoration: none;
        font-size: 1rem;
    }

    .back-link:hover {
        text-decoration: underline;
    }
</style>

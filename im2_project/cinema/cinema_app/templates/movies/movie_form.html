{% extends 'base.html' %}

{% block title %}Add / Edit Movie{% endblock %}

{% block content %}
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #1c1e1e;
        color: #ffffff;
    }

    h2 {
        font-size: 2rem;
        color: #ffa500;
        text-align: center;
        margin-bottom: 20px;
    }

    form {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
        background-color: #2b2b2b;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    }

    form p {
        margin-bottom: 15px;
    }

    input, select, textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        font-size: 1rem;
        border: 1px solid #333;
        border-radius: 5px;
        background-color: #1c1e1e;
        color: #fff;
    }

    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #ffa500;
    }

    button {
        width: 100%;
        padding: 12px;
        font-size: 1.2rem;
        color: #fff;
        background-color: #ffa500;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #e69500;
    }

    a {
        display: block;
        text-align: center;
        margin: 15px auto;
        color: #ffa500;
        text-decoration: none;
        font-size: 1.1rem;
    }

    a:hover {
        color: #e69500;
        text-decoration: underline;
    }
</style>

<h2>{% if form.instance.pk %}Edit Movie{% else %}Add New Movie{% endif %}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>
<a href="{% url 'movie_list' %}">Cancel</a>
{% endblock %}

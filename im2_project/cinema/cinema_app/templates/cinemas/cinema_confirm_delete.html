<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Cinema</title>
    <link href="https://stackpath.bootstrap.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            background-color: #f8f9fa;
        }
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
        .container {
            max-width: 500px;
            width: 90%;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h2 {
            font-size: 1.8rem;
            color: #343a40;
            margin-bottom: 20px;
        }
        p {
            font-size: 1rem;
            color: #343a40;
            margin-bottom: 20px;
        }
        button[type="submit"] {
            padding: 10px 15px;
            font-size: 1rem;
            background-color: #dc3545;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        button[type="submit"]:hover {
            background-color: #c82333;
        }
        a.btn-secondary {
            padding: 10px 15px;
            font-size: 1rem;
            background-color: #6c757d;
            color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            text-decoration: none;
        }
        a.btn-secondary:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div>
            <h2>Admin Panel</h2>
            <a href="{% url 'admin_dashboard' %}">Dashboard</a>
            <a href="{% url 'movie_list' %}">Movies</a>
            <a href="{% url 'cinema_list' %}">Cinemas</a>
            <a href="{% url 'branch_list' %}">Branches</a>
            <a href="{% url 'genre_list' %}">Genres</a>
            <a href="{% url 'cinema_movie_list' %}">Showtime</a>
            <a href="{% url 'seat_list' %}">Seats</a>
        </div>
        <a href="{% url 'admin_logout' %}" class="logout-btn">Logout</a>
    </div>
    <div class="content">
        <div class="container">
            <h2>Delete Cinema</h2>
            <p>Are you sure you want to delete the cinema "{{ cinema.cinema_name }}"?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{% url 'cinema_list' %}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrap.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

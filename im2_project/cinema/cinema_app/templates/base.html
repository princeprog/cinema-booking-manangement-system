<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cinema App{% endblock %}</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1e1e;
            color: #ffffff;
        }

        header {
            background-color: #4b4726;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            color: #ffffff;
            margin: 0;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: #ffa500;
            text-decoration: none;
            font-size: 1.2rem;
            margin: 0 15px;
            padding: 5px 10px;
            border-radius: 5px;
        }

        nav a:hover {
            background-color: #e69500;
            color: #ffffff;
        }

        main {
            padding: 20px;
            max-width: 800px;
            margin: 20px auto;
            background-color: #2b2b2b;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }

        main h2 {
            font-size: 2rem;
            color: #ffa500;
            margin-bottom: 20px;
        }
        span {
            color: #ffa500;
        }
    </style>
</head>
<body>
    <header>
        <a href="{% url 'home_page' %}"><h1><span>C</span>ine<span>C</span>ity</h1></a>
        <nav>
            <a href="{% url 'genre_list' %}">Genres</a>
            <a href="{% url 'movie_list' %}">Movies</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>

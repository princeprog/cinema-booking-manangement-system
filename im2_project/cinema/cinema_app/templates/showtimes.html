<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showtimes</title>
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1e1e;
            color: #ffffff;
        }

        .sidebar {
            width: 250px;
            background-color: #2c2e2f;
            color: white;
            padding: 15px;
            display: flex;
            flex-direction: column;
            /* justify-content: space-between; */
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            margin: 5px 0;
        }

        .sidebar a:hover {
            background-color: #495057;
        }

        .content {
            flex-grow: 1;
            padding: 20px;
            background-color: #2b2b2b;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin: 20px;
        }

        .content h2 {
            font-size: 2rem;
            color: #ffa500;
            text-align: center;
            margin-bottom: 20px;
        }

        .card-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .card {
            background-color: #2b2b2b;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            padding: 20px;
            width: 300px;
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card h3 {
            font-size: 1.5rem;
            color: #ffa500;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 1rem;
            margin: 5px 0;
        }

        .book-now-btn {
            background-color: #ffa500;
            color: #0d1414;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .book-now-btn:hover {
            background-color: #ffb732;
        }

        footer {
            text-align: center;
            padding: 20px;
            background-color: #2b2b2b;
            color: #ffffff;
            margin-top: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        footer .logout-btn {
            background-color: #d9534f;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 5px;
        }

        footer .logout-btn:hover {
            background-color: #c9302c;
        }

        span {
            color: #ffa500;
        }

        .sidebar .logo {
            font-size: 2.0rem;
            color: white;
            font-weight: bold;
            margin-left: 10px;
        }

        .sidebar .logo span {
            color: #ffa500;
        }

    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo"><span>C</span>ine<span>C</span>ity</div>
        <a href="{% url 'landing_page' %}">Home</a>
        <a href="{% url 'about' %}">About Us</a>
        <a href="{% url 'showtimes' %}" style="color: #ffa500;">ShowTimes</a>
        <a href="{% url 'contact' %}">Contact Us</a>
        
        
    </div>
    <div class="content">
        <h2>Showtimes</h2>
        <div class="card-container">
            {% for cinema_movie in cinema_movies %}
                <div class="card">
                    <h3>Movie: {{ cinema_movie.movie_ID.title }}</h3>
                    <p>Cinema: {{ cinema_movie.cinema_ID.cinema_name }}</p>
                    <p>Branch: {{ cinema_movie.cinema_ID.branch.branch_name }}</p>
                    <p>Showtimes: {{ cinema_movie.showtimes }}</p>
                    <button class="book-now-btn"><a href="{% url 'payment' cinema_movie.pk %}">Book Now</a></button>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>

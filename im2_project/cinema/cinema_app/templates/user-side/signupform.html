<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
    <div class="container">
        <div class="image-section">
            <img src="{% static 'images/popcorn.png' %}" alt="Cinema Popcorn">
        </div>
        <div class="form-section">
            <h1>SIGN UP</h1>
            <p>I'm a Ticket Buyer</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">SIGNUP</button>
            </form>
        </div>
    </div>
</body>
</html>

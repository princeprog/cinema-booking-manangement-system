{% extends "base.html" %}

{% block title %}Add/Edit Genre{% endblock %}

{% block content %}
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #1c1e1e;
        color: #ffffff;
    }

    .container {
        max-width: 600px;
        margin: 40px auto;
        padding: 20px;
        background-color: #2b2b2b;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    h2 {
        font-size: 2rem;
        color: #ffa500;
        text-align: center;
        margin-bottom: 20px;
    }

    form {
        display: flex;
        flex-direction: column;
    }

    form p {
        margin-bottom: 15px;
    }

    form label {
        font-size: 1rem;
        color: #ffffff;
        margin-bottom: 5px;
    }

    form input, form select {
        width: 100%;
        padding: 10px;
        font-size: 1rem;
        color: #ffffff;
        background-color: #1c1e1e;
        border: 1px solid #4b4726;
        border-radius: 5px;
    }

    form input::placeholder {
        color: #aaa;
    }

    button[type="submit"], .btn-secondary {
        padding: 10px 15px;
        font-size: 1rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        display: inline-block;
        margin-top: 10px;
    }

    button[type="submit"] {
        background-color: #ffa500;
        color: #1c1e1e;
    }

    button[type="submit"]:hover {
        background-color: #e69500;
    }

    .btn-secondary {
        background-color: #4b4726;
        color: #ffffff;
    }

    .btn-secondary:hover {
        background-color: #6e6b46;
    }

    a {
        text-decoration: none;
        font-weight: bold;
    }
</style>

<div class="container">
    <h2>Add / Edit Genre</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Changes</button>
        <a href="{% url 'genre_list' %}" class="btn-secondary">Cancel</a>
    </form>
</div>
{% endblock %}

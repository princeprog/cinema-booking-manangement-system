<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seats Admin</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            padding: 15px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
            background-color: #f8f9fa;
            color: black;
        }
        .content h1 {
            font-size: 2rem;
            color: #343a40;
            margin-bottom: 20px;
        }
        .list-group-item {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            color: black;
        }
        .list-group-item a {
            color: #343a40;
            text-decoration: none;
        }
        .list-group-item a:hover {
            text-decoration: underline;
        }
        .btn-primary {
            background-color: #007bff;
            border: none;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-warning {
            background-color: #ffc107;
            border: none;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .btn-danger {
            background-color: #dc3545;
            border: none;
        }
        .btn-danger:hover {
            background-color: #c82333;
        }
        .add-seat-form {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
        }
        .add-seat-form h2 {
            font-size: 1.5rem;
            color: #343a40;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Admin Panel</h2>
        <a href="{% url 'movie_list' %}">Movies</a>
        <a href="{% url 'cinema_list' %}">Cinemas</a>
        <a href="{% url 'branch_list' %}">Branches</a>
        <a href="{% url 'genre_list' %}">Genres</a>
        <a href="{% url 'cinema_movie_list' %}">Showtime</a>
        <a href="{% url 'seat_list' %}">Seats</a>
    </div>
    <div class="content">
        <h1>Seats</h1>
        <div class="add-seat-form">
            <h2>Add New Seat</h2>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-primary">Add Seat</button>
            </form>
        </div>
        <ul class="list-group mt-3">
            {% for seat in seats %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>Seat Number: {{ seat.seat_no }}</span>
                    <div>
                        <a class="btn btn-sm btn-warning" href="{% url 'seat_update' seat.pk %}">Update</a>
                        <form method="post" action="{% url 'seat_delete' seat.pk %}" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrap.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showtimes</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1c1e1e;
            color: #ffffff;
            height: 100%;
            width: 100%;
            min-height: 100vh; 
            overflow-x: hidden; 
            display: flex; 
            flex-direction: column; 
        }

        .hero-section {
            position: relative;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                url('{% static "assets/bglanding.jpg" %}') center/cover no-repeat;
            height: 100vh;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-y: auto; /* Enable vertical scrolling */
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0px;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0, 0, 0, 1.0), rgba(0, 0, 0, 0));
            padding: 10px 20px; /* Optional: for some inner spacing */
            height: 100px;
        }

        .navbar .logo {
            font-size: 2.0rem;
            color: white;
            font-weight: bold;
            margin-left: 10px;
        }

        .navbar .logo span {
            color: #ffa500;
        }

        .navbar .nav-links {
            list-style: none;
            display: flex;
            gap: 20px;
        }

        .navbar .nav-links li a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        .navbar .nav-links li a:hover {
            color: #ffa500;
        }

        .navbar .sign-up-btn {
            background-color: #ffa500;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-right: 10px;
        }

        .navbar .sign-up-btn:hover {
            background-color: #e69500;
        }

        /* Showtimes Content */
        .showtimes-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            width: 100%;
            overflow-y: auto; /* Enable vertical scrolling */
        }

        .showtimes-content h1 {
            font-size: 3rem;
            color: #ffa500;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .card {
            background-color: #292929;
            border: none;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px;
            width: 40%;
            max-width: 800px;
        }

        .card-body {
            padding: 20px;
        }

        .card-title {
            font-size: 2rem;
            margin-bottom: 10px;
            color: #ffa500;
        }

        .card-text {
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .details {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .details p {
            margin: 0;
        }

        .details .cinema,
        .details .time {
            font-size: 1.1rem;
            color: #ffffff;
        }

        .book-btn {
            background-color: #ffa500;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .book-btn:hover {
            background-color: #e69500;
        }
    </style>
</head>
<body>
    <header class="hero-section">
        <nav class="navbar">
            <div class="logo"><span>C</span>ine<span>C</span>ity</div>
            <ul class="nav-links">
                <li><a href="{% url 'landing_page' %}">Home</a></li>
                <li><a href="#">About Us</a></li>
                <li><a href="{% url 'showtimes' %}">Showtimes</a></li>
            </ul>
            <button class="sign-up-btn"><a href="{% url 'loginform' %}">Log out</a></button>
        </nav>
        <div class="showtimes-content">
            <h1>Showtimes</h1>
            {% for cinema_movie in cinema_movies %}
                <div class="card">
                    <div class="card-body">
                        <h2 class="card-title">{{ cinema_movie.movie_ID.title }}</h2>
                        <div class="details">
                            <p class="cinema">Cinema: {{ cinema_movie.cinema_ID.cinema_name }}</p>
                            <p class="time">Time: {{ cinema_movie.showtimes }}</p>
                        </div>
                        <form method="get" action="{% url 'payment' cinema_movie.pk %}">
                            <button type="submit" class="book-btn">Book</button>
                        </form>
                    </div>
                </div>
            {% endfor %}
        </div>
    </header>
</body>
</html>

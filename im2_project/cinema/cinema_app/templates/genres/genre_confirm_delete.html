{% extends "base.html" %}

{% block title %}Delete Genre{% endblock %}

{% block content %}
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #1c1e1e;
        color: #ffffff;
    }

    .container {
        max-width: 500px;
        margin: 50px auto;
        padding: 20px;
        background-color: #2b2b2b;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        text-align: center;
    }

    h2 {
        font-size: 2rem;
        color: #ffa500;
        margin-bottom: 20px;
    }

    p {
        font-size: 1.2rem;
        color: #ffffff;
        margin-bottom: 20px;
    }

    button[type="submit"], .btn-secondary {
        padding: 10px 15px;
        font-size: 1rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        text-decoration: none;
        margin: 0 10px;
        display: inline-block;
    }

    button[type="submit"] {
        background-color: #ff4d4d;
        color: #1c1e1e;
    }

    button[type="submit"]:hover {
        background-color: #e64545;
    }

    .btn-secondary {
        background-color: #4b4726;
        color: #ffffff;
    }

    .btn-secondary:hover {
        background-color: #6e6b46;
    }

    a {
        text-decoration: none;
        font-weight: bold;
    }
</style>

<div class="container">
    <h2>Delete Genre</h2>
    <p>Are you sure you want to delete "{{ genre.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Confirm</button>
        <a href="{% url 'genre_list' %}" class="btn-secondary">Cancel</a>
    </form>
    
</div>
{% endblock %}

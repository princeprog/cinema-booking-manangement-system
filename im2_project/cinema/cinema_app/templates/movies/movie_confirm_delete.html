{% extends 'base.html' %}

{% block title %}Confirm Delete{% endblock %}

{% block content %}
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #1c1e1e;
        color: #ffffff;
    }

    h2 {
        font-size: 2rem;
        color: #ffa500;
        text-align: center;
        margin-bottom: 20px;
    }

    p {
        font-size: 1.2rem;
        text-align: center;
        margin-bottom: 30px;
    }

    form {
        text-align: center;
        margin-bottom: 15px;
    }

    button {
        padding: 10px 20px;
        font-size: 1.1rem;
        color: #fff;
        background-color: #e74c3c;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        margin: 0 5px;
    }

    button:hover {
        background-color: #c0392b;
    }

    a {
        display: inline-block;
        text-align: center;
        padding: 10px 20px;
        font-size: 1.1rem;
        color: #fff;
        background-color: #4b4726;
        text-decoration: none;
        border-radius: 5px;
        margin: 0 5px;
    }

    a:hover {
        background-color: #e69500;
        color: #1c1e1e;
    }
</style>

<h2>Confirm Delete</h2>
<p>Are you sure you want to delete the movie "{{ movie.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
</form>
<a href="{% url 'movie_list' %}">Cancel</a>
{% endblock %}

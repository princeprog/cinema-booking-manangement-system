<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genres</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        .sidebar {
            width: 250px;
            background-color: #343a40;
            color: white;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
        }
        .sidebar a:hover {
            background-color: #495057;
        }
        .content {
            flex-grow: 1;
            padding: 20px;
        }
        .logout-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            font-size: 1rem;
        }
        .logout-btn:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div>
            <h2>Admin Panel</h2>
            <a href="{% url 'admin_dashboard' %}">Dashboard</a>
            <a href="{% url 'movie_list' %}">Movies</a>
            <a href="{% url 'cinema_list' %}">Cinemas</a>
            <a href="{% url 'branch_list' %}">Branches</a>
            <a href="{% url 'genre_list' %}">Genres</a>
            <a href="{% url 'cinema_movie_list' %}">Showtime</a>
            <a href="{% url 'seat_list' %}">Seats</a>
        </div>
        <a href="{% url 'admin_logout' %}" class="logout-btn">Logout</a>
    </div>
    <div class="content">
        <h2>Genres</h2>
        <a class="btn btn-primary" href="{% url 'genre_create' %}">Add Genre</a>
        <ul class="list-group mt-3">
            {% for genre in genres %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="#" class="genre-detail-link" data-toggle="modal" data-target="#genreDetailModal" data-id="{{ genre.pk }}">{{ genre.name }}</a>
                    <div>
                        <a class="btn btn-sm btn-warning" href="{% url 'genre_update' genre.pk %}">Edit</a>
                        <form method="post" action="{% url 'genre_delete' genre.pk %}" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger">Delete</button>
                        </form>
                    </div>
                </li>
            {% endfor %}
        </ul>
    </div>

    
</body>
</html>
